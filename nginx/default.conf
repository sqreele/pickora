server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"pickora"}';
    }

    location /data/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=900" always;
        try_files $uri =404;
    }

    location / {
        # Pickora is a single-page application. Do not try a directory here:
        # a trailing-slash deep link can otherwise end in Nginx's 403
        # "directory index is forbidden" response instead of the app shell.
        try_files $uri $uri.html /index.html;
    }
}
