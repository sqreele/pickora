server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    sub_filter_once on;
    sub_filter '</head>' '<meta name="google-site-verification" content="${GOOGLE_SITE_VERIFICATION}"><meta property="og:site_name" content="Pickora"></head>';
    sub_filter '</body>' '<script src="/config.js"></script><script src="/analytics.js"></script><script src="/engagement.js"></script></body>';

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"pickora"}';
    }

    location /data/ {
        alias /usr/share/nginx/data/;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=900" always;

        autoindex off;
        try_files $uri =404;
    }

    location = /data/analytics-summary.json {
        return 404;
    }

    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 'window.PICKORA_CONFIG={ga4MeasurementId:"${GA4_MEASUREMENT_ID}",emailSubscribeEndpoint:"${EMAIL_SUBSCRIBE_ENDPOINT}"};';
    }

    location = /sitemap.xml {
        alias /usr/share/nginx/data/sitemap.xml;
        default_type application/xml;
        add_header Cache-Control "public, max-age=900";
    }

    location ~ ^/products/([a-f0-9]{16})/$ {
        alias /usr/share/nginx/data/products/$1/index.html;
    }

    location ~ ^/categories/([a-f0-9]{12})/$ {
        alias /usr/share/nginx/data/categories/$1/index.html;
    }

    location = /analytics {
        return 308 /analytics/;
    }

    location = /analytics/ {
        try_files /analytics/index.html =404;
        add_header Cache-Control "no-store";
    }

    location ^~ /analytics/ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location = /api/analytics {
        return 404;
    }

    location ^~ /api/analytics/ {
        proxy_pass http://analytics-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
