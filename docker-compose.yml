services:
  scheduler:
    build:
      context: ./app
    container_name: pickora-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      SITE_URL: ${SITE_URL:-https://pickora.hotelcarepro.com}
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    command: ["python", "scheduler.py"]

  worker:
    build:
      context: ./app
    profiles: ["manual"]
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      SITE_URL: ${SITE_URL:-https://pickora.hotelcarepro.com}
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    command: ["python", "run_once.py"]

  web:
    image: nginx:1.27-alpine
    container_name: pickora-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
      EMAIL_SUBSCRIBE_ENDPOINT: ${EMAIL_SUBSCRIBE_ENDPOINT:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      ANALYTICS_DASHBOARD_TOKEN: ${ANALYTICS_DASHBOARD_TOKEN:-}
      NGINX_ENVSUBST_FILTER: GA4_MEASUREMENT_ID|EMAIL_SUBSCRIBE_ENDPOINT|GOOGLE_SITE_VERIFICATION|ANALYTICS_DASHBOARD_TOKEN
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./public:/usr/share/nginx/data:ro
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/health | grep -q '"status":"ok"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - scheduler
    networks:
      - default
      - pcms_network

networks:
  pcms_network:
    external: true
    name: pcms_network
