services:
  scheduler:
    build:
      context: ./app
    container_name: pickora-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    command: ["python", "scheduler.py"]

  worker:
    build:
      context: ./app
    profiles: ["manual"]
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    command: ["python", "run_pipeline.py"]

  web:
    image: nginx:1.27-alpine
    container_name: pickora-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./public:/usr/share/nginx/data:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/health | grep -q '"status":"ok"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - scheduler
